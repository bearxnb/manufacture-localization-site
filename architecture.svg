<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Manufacturing Localization implemented Batch 5 architecture</title><desc id="desc">Browser-only application with deterministic models, immutable runs, report and verified ZIP recovery. No backend or AI service.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#28705d"/></marker></defs><rect width="1100" height="650" fill="#f5f7f2"/><text x="30" y="48" font-family="Georgia,serif" font-size="28" fill="#18362b">Manufacturing Localization · Implemented System</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="14" fill="#4b6357">Batch 5 • browser-only • deterministic • no confidential records in the shipped demo</text><rect x="30" y="110" width="260" height="90" rx="8" fill="white" stroke="#28705d" stroke-width="2"/><text x="44" y="144" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18362b">React workspace</text><text x="44" y="171" font-family="Arial,sans-serif" font-size="12" fill="#4b6357">Six core views + supporting registers</text><rect x="360" y="110" width="320" height="90" rx="8" fill="white" stroke="#28705d" stroke-width="2"/><text x="374" y="144" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18362b">Validated Project 1.0</text><text x="374" y="171" font-family="Arial,sans-serif" font-size="12" fill="#4b6357">Numeric inputs + evidence + versioned config</text><rect x="750" y="110" width="320" height="90" rx="8" fill="white" stroke="#28705d" stroke-width="2"/><text x="764" y="144" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18362b">Deterministic B2 / B3 / B4</text><text x="764" y="171" font-family="Arial,sans-serif" font-size="12" fill="#4b6357">Costs → regional gates → sourcing / decisions</text><rect x="750" y="270" width="320" height="90" rx="8" fill="white" stroke="#28705d" stroke-width="2"/><text x="764" y="304" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18362b">Immutable run record</text><text x="764" y="331" font-family="Arial,sans-serif" font-size="12" fill="#4b6357">Snapshots + exact outputs + source hashes</text><rect x="360" y="270" width="320" height="90" rx="8" fill="white" stroke="#28705d" stroke-width="2"/><text x="374" y="304" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18362b">Shared report model 5.0</text><text x="374" y="331" font-family="Arial,sans-serif" font-size="12" fill="#4b6357">Selected run ID + evidence and stale status</text><rect x="30" y="270" width="260" height="90" rx="8" fill="white" stroke="#28705d" stroke-width="2"/><text x="44" y="304" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18362b">Browser-local persistence</text><text x="44" y="331" font-family="Arial,sans-serif" font-size="12" fill="#4b6357">Manual save; one active project</text><rect x="360" y="440" width="320" height="90" rx="8" fill="white" stroke="#28705d" stroke-width="2"/><text x="374" y="474" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18362b">Printable HTML + offline ZIP</text><text x="374" y="501" font-family="Arial,sans-serif" font-size="12" fill="#4b6357">Case, results, sources, assumptions, actions</text><rect x="750" y="440" width="320" height="90" rx="8" fill="white" stroke="#28705d" stroke-width="2"/><text x="764" y="474" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#18362b">Verified recovery</text><text x="764" y="501" font-family="Arial,sans-serif" font-size="12" fill="#4b6357">ZIP checks → engine replay → projections</text><path d="M290 155H355" stroke="#28705d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M680 155H745" stroke="#28705d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M910 200V265" stroke="#28705d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M750 315H685" stroke="#28705d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M360 315H295" stroke="#28705d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M160 270V205" stroke="#28705d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M520 360V435" stroke="#28705d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M680 485H745" stroke="#28705d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1070 485H1090V225H700V155H685" stroke="#28705d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="585" font-family="Arial,sans-serif" font-size="14" fill="#18362b">Financial costs ≠ attractiveness ≠ evidence confidence. Source geography, vintage and unknowns remain attached.</text><text x="30" y="613" font-family="Arial,sans-serif" font-size="13" fill="#4b6357">No backend • no live supplier outreach • AI disabled • independent review pending • user-controlled local exports</text></svg>
